<title>Market Data Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a trading desk — sticky tab bar, summary tiles first, then small-multiple charts on a quiet grid. */
:root {
  --bg: #f4f6f9;          /* page ground, slight blue bias */
  --panel: #ffffff;
  --ink: #0e1621;
  --ink-2: #566172;
  --ink-3: #8a93a1;
  --rule: #e1e5eb;
  --accent: #2a78d6;      /* UI accent = series slot 1 */
  --up: #1a8f5a;          /* semantic: price up */
  --down: #d03b3b;        /* semantic: price down */
  --inflow: #2a78d6;      /* diverging pole: inflow */
  --outflow: #e34948;     /* diverging pole: outflow */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;  /* BTC ETH SOL XRP */
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
  --grid: rgba(14,22,33,.07);
  --chip: #eef1f5;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #161a21; --ink: #eef1f5; --ink-2: #a3acb9; --ink-3: #6f7886; --rule: #252b34;
    --accent: #3987e5; --up: #2fb573; --down: #e66767; --inflow: #3987e5; --outflow: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --grid: rgba(238,241,245,.07); --chip: #1f252e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --ink: #eef1f5; --ink-2: #a3acb9; --ink-3: #6f7886; --rule: #252b34;
  --accent: #3987e5; --up: #2fb573; --down: #e66767; --inflow: #3987e5; --outflow: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
  --grid: rgba(238,241,245,.07); --chip: #1f252e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--rule);
}
.bar-inner { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 0; display: flex; flex-wrap: wrap; align-items: end; gap: 8px 24px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-stretch: 78%; font-weight: 750; font-size: 22px; letter-spacing: .01em; text-transform: uppercase; }
.brand .asof { font-family: var(--f-data); font-size: 11px; color: var(--ink-2); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
nav.tabs button {
  appearance: none; border: 0; background: none; color: var(--ink-2); font: 600 13px/1 var(--f-body);
  padding: 10px 12px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.view { display: flex; flex-direction: column; gap: 20px; padding-top: 20px; }
h2 { margin: 0; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 17px; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 0; max-width: 72ch; }
.eyebrow { font: 500 10.5px/1 var(--f-data); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; max-width: 100%; }
.seg button { appearance: none; border: 0; background: none; color: var(--ink-2); font: 600 12px/1 var(--f-body); padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.tile { background: var(--panel); box-shadow: 1px 0 0 var(--rule), 0 1px 0 var(--rule); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font: 500 10.5px/1.2 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .d { font: 500 11.5px/1.3 var(--f-data); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.up { color: var(--up); } .down { color: var(--down); }
.pill { display: inline-block; font: 600 10.5px/1 var(--f-data); padding: 3px 6px; border-radius: 99px; background: var(--chip); color: var(--ink-2); letter-spacing: .03em; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card-h h3 { margin: 0; font: 650 13.5px/1.2 var(--f-body); }
.card-h .last { font: 500 12px/1 var(--f-data); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart { position: relative; height: 210px; width: 100%; }
.chart.tall { height: 280px; }
.chart.short { height: 150px; }
.chart.xtall { height: 380px; }
.card.main { gap: 10px; }
.main-chart { height: 520px; }
.readout { font: 500 11.5px/1.4 var(--f-data); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
.readout b { color: var(--ink); font-weight: 600; }
.readout .ro-d { color: var(--ink); }
.readout .ro-m { display: inline-flex; align-items: center; gap: 5px; }
.readout .ro-m i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.tgl .grp { font-size: 9.5px; letter-spacing: .06em; color: var(--ink-3); }
.card-h .last.big { font: 700 20px/1 var(--f-display); font-stretch: 82%; color: var(--ink); }
@media (max-width: 520px) { .main-chart { height: 380px; } }
.toggles { gap: 6px; }
.tgl { appearance: none; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); font: 500 12px/1 var(--f-data);
  padding: 6px 10px; border-radius: 99px; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.tgl i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tgl[aria-pressed="false"] { color: var(--ink-3); background: transparent; }
.tgl[aria-pressed="false"] i { opacity: .3; }
.tgl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.card summary { cursor: pointer; list-style: revert; }
.stat .v.up { color: var(--up); } .stat .v.down { color: var(--down); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 11.5px/1.2 var(--f-data); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; display: inline-block; border-radius: 2px; }
.legend i.sq { width: 10px; height: 10px; border-radius: 2px; }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.stat .k { font: 500 10.5px/1.2 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.stat .v { font: 700 20px/1.2 var(--f-display); font-stretch: 82%; font-variant-numeric: tabular-nums; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font: 500 12px/1.3 var(--f-data); font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 500; font-size: 11px; }
td.pos { color: var(--inflow); } td.neg { color: var(--outflow); } td.zero { color: var(--ink-3); }
.corr td.cell { font-weight: 600; }

.note { font-size: 12px; color: var(--ink-2); max-width: 90ch; }
.note b { color: var(--ink); font-weight: 600; }
footer { margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.fresh { display: flex; flex-wrap: wrap; gap: 6px; }
.err { padding: 24px; border: 1px solid var(--rule); background: var(--panel); border-radius: 10px; }
@media (max-width: 520px) {
  .grid, .grid.two { grid-template-columns: 1fr; }
  .tile .v { font-size: 22px; }
  nav.tabs { margin-left: 0; width: 100%; }
}

/* coin pages */
.coin-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.coin-head .px { font: 700 34px/1 var(--f-display); font-stretch: 78%; font-variant-numeric: tabular-nums; }
.coin-head .px small { font: 500 13px/1 var(--f-data); margin-left: 8px; }
.says { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 20px; margin: 0; padding: 0; list-style: none; }
.says li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: baseline; font-size: 13px; color: var(--ink); min-width: 0; }
.says li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--ink-3); transform: translateY(-1px); }
.says li.bull::before { background: var(--up); } .says li.bear::before { background: var(--down); }
.says b { font-weight: 650; }
.stack { display: flex; flex-direction: column; }
.pane { position: relative; width: 100%; border-top: 1px solid var(--rule); }
.pane:first-child { border-top: 0; }
.pane .tag { position: absolute; left: 8px; top: 6px; z-index: 3; font: 600 10px/1 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); pointer-events: none; background: var(--panel); padding: 2px 4px; border-radius: 3px; }
.pane.price { height: 440px; } .pane.low { height: 130px; }
@media (max-width: 520px) { .pane.price { height: 320px; } .pane.low { height: 110px; } .coin-head .px { font-size: 28px; } }
.sig-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px 22px; }
.sig-list li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; align-items: start; font-size: 13px; min-width: 0; }
.sig-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 3px; display: inline-block; }
.sig-v { display: block; font: 500 12px/1.4 var(--f-data); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sig-r { font-size: 11.5px; color: var(--ink-3); }
#sig-card .card-h h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.formulas { font-size: 12px; color: var(--ink-2); display: grid; gap: 6px; max-width: 95ch; }
.formulas code { font: 500 11.5px/1.4 var(--f-data); color: var(--ink); }

/* ETF daily report */
.er { display: flex; flex-direction: column; gap: 14px; }
.er-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; background: linear-gradient(135deg, #0f1f33, #1c3553); color: #fff; border-radius: 12px; padding: 20px 22px; }
.er-eyebrow { font: 600 11px/1 var(--f-data); letter-spacing: .12em; color: #b9a6ff; }
.er-title { font: 750 34px/1.1 var(--f-display); font-stretch: 85%; margin: 8px 0 6px; color: #fff; }
.er-sub { font-size: 14px; color: #c9d3e0; } .er-sub b { color: #fff; }
.er-meta { font: 500 12.5px/1.6 var(--f-data); color: #c9d3e0; text-align: right; } .er-meta b { color: #fff; }
.er-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.er-kpi { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.er-kpi .k { font: 650 13px/1.2 var(--f-body); color: var(--ink-2); }
.er-kpi .v { font: 750 26px/1 var(--f-display); font-stretch: 82%; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.er-kpi .d { display: flex; justify-content: space-between; align-items: center; gap: 6px; font: 500 11.5px/1.2 var(--f-data); color: var(--ink-2); flex-wrap: wrap; }
.er-kpi.dark { background: #0f1f33; border-color: #0f1f33; color: #fff; } .er-kpi.dark .k, .er-kpi.dark .d { color: #c9d3e0; }
.er-pill { font: 650 11px/1 var(--f-data); padding: 4px 7px; border-radius: 6px; background: var(--chip); color: var(--ink-2); }
.er-pill.up { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); } .er-pill.down { background: color-mix(in srgb, var(--down) 16%, transparent); color: var(--down); }
.er-sub2 { font: 600 12px/1 var(--f-data); color: #fff; }
.er-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; background: var(--chip); border-radius: 12px; padding: 12px 16px; }
.er-strip > div { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
.er-strip b { font-size: 13px; } .er-strip span { grid-column: 1; font: 500 11px/1.3 var(--f-data); color: var(--ink-2); } .er-strip em { grid-column: 2; grid-row: 1 / span 2; font: 650 15px/1 var(--f-data); font-style: normal; font-variant-numeric: tabular-nums; }
.er-text p { margin: 0; font-size: 14px; line-height: 1.65; }
.er-grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.er-focus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.er-focus > div { border-radius: 10px; padding: 10px 12px; } .er-focus .up { background: color-mix(in srgb, var(--up) 9%, transparent); } .er-focus .dn { background: color-mix(in srgb, var(--down) 9%, transparent); }
.er-focus h4 { margin: 0 0 8px; font-size: 14px; text-align: center; } .er-focus .up h4 { color: var(--up); } .er-focus .dn h4 { color: var(--down); }
.er-focus .row { display: grid; grid-template-columns: 18px 1fr; gap: 2px 6px; font-size: 12.5px; margin-bottom: 6px; } .er-focus .row i { font: 650 10px/18px var(--f-data); font-style: normal; text-align: center; border-radius: 50%; background: var(--panel); height: 18px; }
.er-focus .row b { grid-column: 2; text-align: right; font: 650 12.5px/1 var(--f-data); } .er-focus small, .er-bars small, .er-rank small { color: var(--ink-3); font: 500 10px var(--f-data); }
.er-bars .row { display: grid; grid-template-columns: 118px 1fr 92px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid var(--rule); }
.er-bars .track { position: relative; height: 12px; } .er-bars .track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.er-bars .track i { position: absolute; top: 0; height: 12px; border-radius: 3px; } .er-bars .track i.pos { background: var(--up); } .er-bars .track i.neg { background: var(--down); }
.er-bars b { text-align: right; font: 650 12px/1 var(--f-data); }
.er-share { display: inline-block; width: 60px; height: 4px; border-radius: 2px; background: var(--chip); margin-right: 8px; vertical-align: middle; } .er-share i { display: block; height: 4px; border-radius: 2px; background: var(--s1); }
.er-counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .er-counts > div, .er-big > div { border-radius: 10px; padding: 10px; background: var(--chip); text-align: center; }
.er-counts span, .er-big span { display: block; font-size: 12px; color: var(--ink-2); } .er-counts b { font: 750 30px/1.2 var(--f-display); }
.er-counts .up, .er-big .up { background: color-mix(in srgb, var(--up) 9%, transparent); } .er-counts .up b, .er-big .up em { color: var(--up); }
.er-counts .dn, .er-big .dn { background: color-mix(in srgb, var(--down) 9%, transparent); } .er-counts .dn b, .er-big .dn em { color: var(--down); }
.er-big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; } .er-big b { display: block; font-size: 16px; margin: 4px 0; } .er-big em { font: 700 18px/1.2 var(--f-data); font-style: normal; }
.er-sums { display: grid; gap: 4px; margin-top: 8px; font-size: 12.5px; } .er-sums div { display: flex; justify-content: space-between; } .er-sums b { font-family: var(--f-data); }
.er-method { max-width: none; }
@media (max-width: 520px) { .er-title { font-size: 26px; } .er-bars .row { grid-template-columns: 96px 1fr 80px; } .er-meta { text-align: left; } }
/* print layout for the daily image */
body.print header.bar, body.print footer, body.print .er-controls { display: none !important; }
body.print .wrap { max-width: 1400px; padding: 24px; } body.print section.view { padding-top: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

    <div class="brand">
      <h1>Market Data Hub</h1>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
  const ASSETS = ["BTC", "ETH", "SOL", "XRP"];
  const SERIES = { BTC: "--s1", ETH: "--s2", SOL: "--s3", XRP: "--s4", ZEC: "--s5" };
  let D = null;
  const charts = {};
  const state = { view: "overview", etfAsset: "BTC", etfRange: 90, mktRange: 1095, derivSym: "BTCUSDT", derivRange: "90", coinTf: "1d", coinMa: "sma", coinScale: "log" };
  try { const s = JSON.parse(localStorage.getItem("amd-state") || "{}"); Object.assign(state, s); } catch (e) {}
  const save = () => { try { localStorage.setItem("amd-state", JSON.stringify(state)); } catch (e) {} };

  // ---------- helpers
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, html = "") => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); e.innerHTML = html; return e; };
  const isNum = (x) => typeof x === "number" && isFinite(x);
  const lastIdx = (arr) => { for (let i = arr.length - 1; i >= 0; i--) if (isNum(arr[i])) return i; return -1; };
  const lastVal = (arr) => { const i = lastIdx(arr); return i < 0 ? null : arr[i]; };
  const valAgo = (arr, i, n) => { for (let j = i - n; j >= 0 && j >= i - n - 7; j--) if (isNum(arr[j])) return arr[j]; return null; };
  const fmt = (x, d = 2) => isNum(x) ? x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
  const fmtPx = (x) => !isNum(x) ? "–" : x >= 1000 ? "$" + fmt(x, 0) : x >= 10 ? "$" + fmt(x, 2) : "$" + fmt(x, 4);
  const fmtM = (m) => !isNum(m) ? "–" : (Math.abs(m) >= 1000 ? (m < 0 ? "−$" : "+$") + fmt(Math.abs(m) / 1000, 2) + "B" : (m < 0 ? "−$" : m > 0 ? "+$" : "$") + fmt(Math.abs(m), 1) + "M");
  const pct = (a, b) => (isNum(a) && isNum(b) && b !== 0) ? (a / b - 1) * 100 : null;
  const signCls = (x) => !isNum(x) ? "" : x > 0 ? "up" : x < 0 ? "down" : "";
  const sgn = (x, d = 2, unit = "%") => !isNum(x) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + fmt(Math.abs(x), d) + unit;

  // ================================================================ BTC main chart (candles + cycle moving averages)
  // Weekly averages are computed "as of" each day: the current week's bar uses that day's close,
  // exactly what a live weekly chart shows at that moment, so there is no look-ahead on the daily view.
  const BTC_LINES = [
    { key: "sma20w", label: "20W SMA", color: "--s2", style: 0, on: true, group: "Bull market support band" },
    { key: "ema21w", label: "21W EMA", color: "--s2", style: 2, on: true, group: "Bull market support band" },
    { key: "sma50w", label: "50W SMA", color: "--s1", style: 0, on: true },
    { key: "sma200w", label: "200W SMA", color: "--s7", style: 0, on: true },
    { key: "sma50d", label: "50D SMA", color: "--s3", style: 0, on: false },
    { key: "sma200d", label: "200D SMA", color: "--s5", style: 0, on: false },
  ];
  let btcChart = null;
  const mondayOf = (iso) => { const d = new Date(iso + "T00:00:00Z"); const wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd); return d.toISOString().slice(0, 10); };
  function btcSeries() {
    const B = D.btc_ohlc, n = B.date.length;
    // weekly bars (Monday-start)
    const weeks = [], wIdx = new Array(n);
    for (let i = 0; i < n; i++) {
      const wk = mondayOf(B.date[i]); let w = weeks[weeks.length - 1];
      if (!w || w.time !== wk) { w = { time: wk, open: B.o[i], high: B.h[i], low: B.l[i], close: B.c[i] }; weeks.push(w); }
      else { w.high = Math.max(w.high, B.h[i]); w.low = Math.min(w.low, B.l[i]); w.close = B.c[i]; }
      wIdx[i] = weeks.length - 1;
    }
    const wc = weeks.map((w) => w.close);
    // completed-week helpers
    const smaW = (len, k, closeNow) => { if (k < len - 1) return null; let s = closeNow; for (let j = k - len + 1; j < k; j++) s += wc[j]; return s / len; };
    const alpha = 2 / 22, emaDone = new Array(weeks.length).fill(null);   // EMA at end of each completed week
    for (let k = 0; k < weeks.length; k++) {
      if (k < 20) continue;
      emaDone[k] = k === 20 ? wc.slice(0, 21).reduce((a, b) => a + b, 0) / 21 : emaDone[k - 1] * (1 - alpha) + wc[k] * alpha;
    }
    const daily = { sma20w: [], ema21w: [], sma50w: [], sma200w: [], sma50d: [], sma200d: [] };
    let s50 = 0, s200 = 0;
    for (let i = 0; i < n; i++) {
      const t = B.date[i], k = wIdx[i], c = B.c[i];
      const push = (key, val) => { if (isNum(val)) daily[key].push({ time: t, value: val }); };
      push("sma20w", smaW(20, k, c)); push("sma50w", smaW(50, k, c)); push("sma200w", smaW(200, k, c));
      push("ema21w", k > 20 && isNum(emaDone[k - 1]) ? emaDone[k - 1] * (1 - alpha) + c * alpha : null);
      s50 += c; s200 += c; if (i >= 50) s50 -= B.c[i - 50]; if (i >= 200) s200 -= B.c[i - 200];
      push("sma50d", i >= 49 ? s50 / 50 : null); push("sma200d", i >= 199 ? s200 / 200 : null);
    }
    const weekly = { sma20w: [], ema21w: [], sma50w: [], sma200w: [], sma50d: [], sma200d: [] };
    for (let k = 0; k < weeks.length; k++) {
      const t = weeks[k].time, p = (key, val) => { if (isNum(val)) weekly[key].push({ time: t, value: val }); };
      p("sma20w", smaW(20, k, wc[k])); p("sma50w", smaW(50, k, wc[k])); p("sma200w", smaW(200, k, wc[k])); p("ema21w", emaDone[k]);
    }
    const candles = B.date.map((t, i) => ({ time: t, open: B.o[i], high: B.h[i], low: B.l[i], close: B.c[i] }));
    return { candles, weeks, daily, weekly };
  }
  function renderBtcChart() {
    const host = $("#btc-main"); if (!host || !window.LightweightCharts) return;
    if (btcChart) { try { btcChart.remove(); } catch (e) {} btcChart = null; }
    state.btcOn = state.btcOn || Object.fromEntries(BTC_LINES.map((l) => [l.key, l.on]));
    const S = btcSeries(), weekly = state.btcTf === "1w";
    const LC = window.LightweightCharts;
    const chart = LC.createChart(host, {
      autoSize: true,
      layout: { background: { type: "solid", color: css("--panel") }, textColor: css("--ink-2"), fontFamily: "'IBM Plex Mono', ui-monospace, Menlo, monospace", fontSize: 11 },
      grid: { vertLines: { visible: false }, horzLines: { color: css("--grid") } },
      rightPriceScale: { borderColor: css("--rule"), mode: state.btcScale === "lin" ? 0 : 1 },
      timeScale: { borderColor: css("--rule"), rightOffset: 4, minBarSpacing: 0.05 },
      crosshair: { mode: 0 },
      localization: { locale: "en-US", priceFormatter: (x) => "$" + Math.round(x).toLocaleString("en-US"), dateFormat: "yyyy-MM-dd" },
    });
    btcChart = chart;
    const up = css("--up"), down = css("--down");
    const cs = chart.addCandlestickSeries({ upColor: up, downColor: down, wickUpColor: up, wickDownColor: down, borderVisible: false, priceLineVisible: false });
    cs.setData(weekly ? S.weeks : S.candles);
    // volume pane: BTC spot volume across Binance + Coinbase + Upbit (USD)

  function corr(xs, ys) {
    const p = []; for (let i = 0; i < xs.length; i++) if (isNum(xs[i]) && isNum(ys[i])) p.push([xs[i], ys[i]]);
    if (p.length < 20) return null;
    const mx = p.reduce((s, q) => s + q[0], 0) / p.length, my = p.reduce((s, q) => s + q[1], 0) / p.length;
    let sxy = 0, sxx = 0, syy = 0; for (const [x, y] of p) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; syy += (y - my) ** 2; }
    return sxy / Math.sqrt(sxx * syy);
  }

    return out;
  }

    single("mk-t3", m.total3_b, css("--s3"), (x) => "$" + fmt(x, 0) + "B", "TOTAL3");

    single("mc-vix", m.vix, css("--ink"), (x) => fmt(x, 1), "VIX");
    const H = D.market_1h;
    single("mk-1h", H.total3_b, css("--s3"), (x) => "$" + fmt(x, 0) + "B", "TOTAL3", H.ts.map((t) => t.slice(5)));

    const btcR = changes(M.btc), N = M.date.length;
    const series = [["US 10Y yield", changes(M.us10y, false)], ["DXY", changes(M.dxy)], ["S&P 500", changes(M.spx)], ["VIX", changes(M.vix)], ["TOTAL3", changes(M.total3_b)], ["Net liquidity", changes(M.netliq_t, false)]];
    const wins = [[30, "30d"], [90, "90d"], [365, "1y"]];
    const cellColor = (c) => !isNum(c) ? "" : Math.abs(c) < .15 ? "zero" : c > 0 ? "pos" : "neg";
    $("#corr").innerHTML = `<thead><tr><th>vs BTC</th>${wins.map((w) => `<th>${w[1]}</th>`).join("")}</tr></thead><tbody>${series.map(([name, s]) =>
      `<tr><td>${name}</td>${wins.map(([w]) => { const c = corr(btcR.slice(N - w), s.slice(N - w)); return `<td class="cell ${cellColor(c)}">${isNum(c) ? (c > 0 ? "+" : c < 0 ? "−" : "") + fmt(Math.abs(c), 2) : "–"}</td>`; }).join("")}</tr>`).join("")}</tbody>`;
  }


  // ================================================================ DERIVATIVES
  // One overlay chart: every series rescaled to 0–100 within the visible range (0 = its low, 100 = its high),
  // so lines of very different units share one honest axis. Tooltips show the real values.
  const DERIV_SERIES = [
    { key: "price",       label: "Price",               color: "--ink", width: 2.5, fmt: (x) => fmtPx(x), on: true },
    { key: "oi_b",        label: "Open interest",       color: "--s1", fmt: (x) => "$" + fmt(x, 2) + "B", on: true },
    { key: "ls_accounts", label: "Long/short (accounts)", color: "--s2", fmt: (x) => fmt(x, 2), on: true },
    { key: "ls_top",      label: "Long/short (top traders)", color: "--s3", fmt: (x) => fmt(x, 2), on: false, dailyOnly: true },
    { key: "taker",       label: "Taker buy/sell",      color: "--s4", fmt: (x) => fmt(x, 2), on: false },
    { key: "premium_bp",  label: "Perp premium",        color: "--s5", fmt: (x) => fmt(x, 1) + " bp", on: false },
    { key: "basis_bp",    label: "Basis vs spot",       color: "--s7", fmt: (x) => fmt(x, 1) + " bp", on: false, dailyOnly: true },
    { key: "vol",         label: "Futures volume",      color: "--s6", fmt: (x) => "$" + fmt(x, 2) + "B", on: false },
  ];
  const rescale = (arr) => {
    const v = arr.filter(isNum); if (!v.length) return arr.map(() => null);
    const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
    return arr.map((x) => isNum(x) ? ((x - lo) / span) * 100 : null);
  };
  function readFlow(p, o) {  // classic price/OI read
    if (!isNum(p) || !isNum(o)) return "";
    const P = p > 0.5 ? 1 : p < -0.5 ? -1 : 0, O = o > 1 ? 1 : o < -1 ? -1 : 0;
    if (P > 0 && O > 0) return "Price up with rising OI: new positions are backing the move.";
    if (P > 0 && O < 0) return "Price up while OI falls: shorts closing (short covering), less fresh conviction.";
    if (P < 0 && O > 0) return "Price down with rising OI: new shorts opening, or longs adding into weakness.";
    if (P < 0 && O < 0) return "Price down while OI falls: longs closing or being liquidated.";
    if (O > 0) return "Price flat while OI builds: leverage is accumulating; watch for a breakout either way.";
    if (O < 0) return "Price flat while OI drops: positions being cleared out.";
    return "Price and OI both roughly flat.";
  }
  function renderDeriv() {

    const hourly = state.derivRange === "14h";
    let X;
    if (hourly) X = S.hourly; else { const n = Number(state.derivRange); X = n ? cut(S.daily, Math.max(0, S.daily.date.length - n)) : S.daily; }
    const L = hourly ? X.ts.map((t) => t.slice(5)) : X.date;
    const asset = state.derivSym.replace("USDT", "");
    const avail = DERIV_SERIES.filter((s) => X[s.key] && !(hourly && s.dailyOnly));

    // summary over the visible range
    const first = (a) => a.find(isNum), last = (a) => lastVal(a);
    const pChg = pct(last(X.price), first(X.price)), oChg = pct(last(X.oi_b), first(X.oi_b));
    const ls0 = first(X.ls_accounts), ls1 = last(X.ls_accounts);
    const prem = last(X.premium_bp);

    v.innerHTML = `
      <div class="controls">
        ${seg("derivSym", syms.map((s) => [s, s.replace("USDT", "")]), state.derivSym)}

      <p class="sub">Binance only, not the whole market.</p></div>
      <div class="stats">
        <div class="stat"><div class="k">Price over range</div><div class="v ${signCls(pChg)}">${sgn(pChg, 1)}</div><div class="note">${fmtPx(last(X.price))}</div></div>
        <div class="stat"><div class="k">Open interest</div><div class="v ${signCls(oChg)}">${sgn(oChg, 1)}</div><div class="note">$${fmt(last(X.oi_b), 2)}B now</div></div>
        <div class="stat"><div class="k">Long/short (accounts)</div><div class="v">${fmt(ls1, 2)}</div><div class="note">from ${fmt(ls0, 2)} · ${isNum(ls1) ? (ls1 > 1 ? "more accounts long" : "more accounts short") : ""}</div></div>
        <div class="stat"><div class="k">Perp premium</div><div class="v">${fmt(prem, 1)} bp</div><div class="note">${isNum(prem) ? (prem > 6 ? "rich: funding above default" : prem < -4 ? "discount: funding below default" : "normal range") : ""}</div></div>
      </div>
      <div class="note"><b>Read:</b> ${readFlow(pChg, oChg)}</div>
      <div class="card">
        <div class="card-h"><h3>Overlay</h3><span class="last">each line scaled to its own low (0) and high (100) in this range · hover for real values</span></div>
        <div class="legend toggles" role="group" aria-label="Series">${avail.map((s) =>
          `<button class="tgl" data-series="${s.key}" aria-pressed="${!!state.derivOn[s.key]}"><i style="background:var(${s.color})"></i>${s.label}</button>`).join("")}</div>
        <div class="chart xtall"><canvas id="dv-overlay" role="img" aria-label="${asset} price, open interest and positioning overlay"></canvas></div>
      </div>

        <p class="sub">"Tracked OI" covers Binance, OKX, Bybit and Hyperliquid, not the whole market. OKX keeps 180 days of OI history and Hyperliquid has none, so those bars fill in as the hourly job collects them.</p></div>
        <div class="card"><div class="card-h"><h3>Open interest by exchange</h3><span class="last" id="dv-oi-venue-last"></span></div>
          <div class="legend" id="dv-oi-venue-legend"></div>
          <div class="chart tall"><canvas id="dv-oi-venue" role="img" aria-label="Open interest by exchange"></canvas></div></div>
        <div class="grid two">
          <div class="card"><div class="card-h"><h3>Funding by exchange (per 8h)</h3><span class="last">daily average, bp</span></div>

            <div class="note">1 bp per 8h is the default "neutral" rate. Higher = longs paying up; negative = shorts paying longs. Hyperliquid pays hourly and is scaled to 8h here.</div></div>
          <div class="card" id="dv-cme-card"><div class="card-h"><h3>CME futures positioning (weekly)</h3><span class="last" id="dv-cme-last"></span></div>
            <div class="legend">${legendItem(css("--ink"), "Open interest")}${legendItem(css("--s2"), "Leveraged funds net")}${legendItem(css("--s1"), "Asset managers net")}</div>
            <div class="chart"><canvas id="dv-cme" role="img" aria-label="CME positioning"></canvas></div>
            <div class="note">CFTC Traders in Financial Futures report, converted from contracts to coins. Leveraged funds (hedge funds) often run the basis trade, so their net short tracks ETF buying.</div></div>
        </div>
      </section>
      <details class="card" ${state.derivDetails ? "open" : ""} id="dv-details"><summary><h3 style="display:inline">Each series on its own scale</h3></summary>
        <div class="grid" style="margin-top:10px">
          ${card("dv-px", asset + " spot price")}
          ${card("dv-oi", "Open interest (USD)")}
          ${card("dv-ls", "Long/short ratio (accounts)")}
          ${card("dv-prem", "Perp premium index", { note: "Premium of the perpetual over the spot index, in bp. Binance funding per 8h = premium + clamp(1 bp − premium, ±5 bp), so −4 to +6 bp still pays the default +1 bp to shorts." })}
        </div>
      </details>`;

    // overlay
    const o = baseOpts();
    o.scales.y.min = 0; o.scales.y.max = 100;
    o.scales.y.ticks.callback = (val) => (val === 0 ? "low" : val === 50 ? "mid" : val === 100 ? "high" : "");
    o.scales.y.ticks.stepSize = 50; o.scales.y.ticks.maxTicksLimit = 3;
    o.layout = { padding: { top: 6, bottom: 2 } };
    o.plugins.tooltip.callbacks = { label: (ctx) => { const s = avail[ctx.datasetIndex]; return ` ${s.label}: ${s.fmt(X[s.key][ctx.dataIndex])}`; } };
    draw("dv-overlay", { type: "line", options: o, data: { labels: L, datasets: avail.map((s) => ({
      label: s.label, data: rescale(X[s.key]), hidden: !state.derivOn[s.key],
      borderColor: css(s.color), backgroundColor: css(s.color), borderWidth: s.width || 1.75,
      pointRadius: 0, pointHoverRadius: 4, tension: 0, spanGaps: true, fill: false, clip: 6,
    })) } });

    // detail small multiples (only drawn when opened, to keep things light)
    const drawDetails = () => {
      const color = SERIES[asset] ? css(SERIES[asset]) : css("--ink");
      const one = (id, data, f, c = color) => { line(id, L, [{ label: "", data, borderColor: c, backgroundColor: c }], { yFmt: f }); $("#" + id + "-last").textContent = f(lastVal(data)); };
      one("dv-px", X.price, fmtPx);
      one("dv-oi", X.oi_b, (x) => "$" + fmt(x, 2) + "B");
      one("dv-ls", X.ls_accounts, (x) => fmt(x, 2), css("--s2"));
      polarityBars("dv-prem", L, X.premium_bp, { yFmt: (x) => fmt(x, 1) + " bp", label: "Premium" }); $("#dv-prem-last").textContent = fmt(lastVal(X.premium_bp), 2) + " bp";
    };
    const det = $("#dv-details");
    if (det.open) drawDetails();
    det.addEventListener("toggle", () => { state.derivDetails = det.open; save(); if (det.open) drawDetails(); });
    renderAcross(asset);
  }

  document.addEventListener("click", (ev) => {
    const b = ev.target.closest("button.tgl[data-series]"); if (!b || !state.derivOn) return;
    const k = b.dataset.series; state.derivOn[k] = !state.derivOn[k]; save();

    const ch = charts["dv-overlay"]; if (!ch) return;

  });

  // ================================================================ COIN PAGES (BTC ETH XRP SOL ZEC)
  // Candles + indicators come precomputed from coins/<SYM>.json (mdh/indicators.py); the page only draws them.
  const COIN_CACHE = {};
  let coinCharts = [];
  const COIN_TF = [["4h", "4H"], ["1d", "1D"], ["1w", "1W"], ["1M", "1M"]];
  const COIN_RANGE = { "4h": 90, "1d": 365, "1w": 365 * 4, "1M": 0 };   // default visible window, days (0 = all)
  const MA_COLORS = { 20: "--s1", 30: "--s3", 50: "--s2", 100: "--s7" };
  const TF_WORD = { "4h": "4-hour", "1d": "daily", "1w": "weekly", "1M": "monthly" };
  const loadCoin = (a) => COIN_CACHE[a] || (COIN_CACHE[a] = fetch(`coins/${a}.json`, { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .catch((e) => { delete COIN_CACHE[a]; throw e; }));
  const fmtUsd = (x) => !isNum(x) ? "–" : (x < 0 ? "−$" : "$") + (Math.abs(x) >= 1e9 ? fmt(Math.abs(x) / 1e9, 2) + "B" : Math.abs(x) >= 1e6 ? fmt(Math.abs(x) / 1e6, 1) + "M" : fmt(Math.abs(x) / 1e3, 0) + "K");
  const fmtSignedUsd = (x) => !isNum(x) ? "–" : (x > 0 ? "+" : "") + fmtUsd(x);
  const fmtCoin = (x) => !isNum(x) ? "–" : x >= 1e6 ? fmt(x / 1e6, 2) + "M" : x >= 1e3 ? fmt(x / 1e3, 1) + "K" : fmt(x, 0);
  const pxDec = (c) => { const v = c.find(isNum) || 1; return v >= 1000 ? 0 : v >= 10 ? 2 : 4; };

  function coinShell(a) {
    const S = (D.coins || {})[a];
    const d1 = S && S.tf["1d"], dv = S && S.deriv;
    const t = (k, v, d) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
    const tiles = !S ? "" : `<div class="tiles">
      ${t("Price · live", fmtPx(d1.close), `<span class="${signCls(d1.chg_pct)}">${sgn(d1.chg_pct)}</span> 24h` + (S.live && isNum(S.live.chg7_pct) ? ` · <span class="${signCls(S.live.chg7_pct)}">${sgn(S.live.chg7_pct, 1)}</span> 7d` : ""))}
      ${t("RSI 14 · daily", fmt(d1.rsi, 0), d1.rsi >= 70 ? "overbought" : d1.rsi <= 30 ? "oversold" : "neutral 30–70")}
      ${t("MACD · daily", d1.macd_side === "bull" ? "Above signal" : "Below signal", isNum(d1.macd_cross_bars_ago) ? `crossed ${d1.macd_cross_bars_ago} day${d1.macd_cross_bars_ago === 1 ? "" : "s"} ago` : "")}
      ${dv ? t("Open interest", fmtCoin(dv.oi) + " " + a, `<span class="${signCls(dv.oi_chg7_pct)}">${sgn(dv.oi_chg7_pct, 1)}</span> 7d · ${fmtUsd(dv.oi_usd)}`) : ""}
      ${dv ? (dv.funding ? t("Funding · per 8h", sgn(dv.funding.last_bp8, 2, " bp"), `7d avg ${sgn(dv.funding.avg7_bp8, 2, " bp")} · default +1 bp` + (isNum(dv.funding.est_next_bp8) ? ` · next ≈ ${sgn(dv.funding.est_next_bp8, 2, " bp")}` : ""))
                         : t("Funding · 7d avg", sgn(dv.funding_apr_7d, 1), "a year · default ≈ 11%")) : ""}
      ${dv ? t("CVD · 7d", `<span class="${signCls(dv.spot_cvd_7d)}">${fmtSignedUsd(dv.spot_cvd_7d)}</span>`, `spot · perp <span class="${signCls(dv.perp_cvd_7d)}">${fmtSignedUsd(dv.perp_cvd_7d)}</span>`) : ""}
    </div>`;
    const says = S && S.readout && S.readout.length ? `<div class="card"><div class="card-h"><h3>What the numbers say</h3><span class="last">last closed candle</span></div>

        </div>
      </div>
      ${tiles}
      ${says}

      ${intentsCard(a, S)}
      ${whaleCard(a, S)}
      <div class="card main">

        <div class="stack" id="coin-stack">
          <div class="pane price" id="cp-price"><span class="tag">Price · MA 20/30/50/100 · spot volume</span></div>
          <div class="pane low" id="cp-macd"><span class="tag">MACD 12 26 9</span></div>
          <div class="pane low" id="cp-rsi"><span class="tag">RSI 14</span></div>

          ${legendItem("var(--s1)", "MACD")}${legendItem("var(--s2)", "Signal")}
          ${legendItem("var(--s1)", "Spot CVD")}${legendItem("var(--s2)", "Perp CVD")}
        </div>
      </div>
      ${fibCard(a, S)}

      ${relCard(a, S)}
      <details class="card"><summary><b>How these are calculated</b></summary>
        <div class="formulas">
          <div>Candles use Binance's UTC boundaries: 4H at 00/04/08/12/16/20 UTC, days at 00:00 UTC, weeks from Monday 00:00 UTC, months from the 1st. The newest candle is still forming; the readout and signals use the last closed one.</div>
          <div><code>SMA(n)</code> mean of the last n closes. <code>EMA(n)</code> weight 2/(n+1), seeded with the first close, shown once n candles exist. Same definitions as TradingView's <code>ta.sma</code> / <code>ta.ema</code>.</div>
          <div><code>MACD</code> = EMA12 − EMA26 of the close, <code>signal</code> = EMA9 of MACD, bars = MACD − signal. Calculated over the full history so the start-up period has washed out. Values differ from other charts only when their candles differ (exchange, spot vs perpetual, time zone of the daily close).</div>
          <div><code>RSI 14</code> Wilder's method (smoothing 1/14). <code>Funding</code> = sum of Binance funding settlements inside the candle, shown as a yearly rate. <code>Open interest</code> = contracts open at the candle's close. <code>CVD</code> = running total of taker buys − taker sells (USD), from Binance kline taker-buy volume.</div>
        </div>

  // ---------- rebound signals (math in mdh/indicators.py rebound_signals; closed UTC days)
  const SIG_ROWS = [
    ["flush", "Leverage flushed", "OI at least 15% below its 14-day high"],
    ["shorts", "Shorts crowded", "funding below 0, or top traders' long/short 15%+ off its 14-day high"],
    ["us", "US buying", "Coinbase premium, day average, +3 bp or more"],
    ["spot", "Spot buying", "Binance spot net taker buying two days running"],
    ["etf", "ETF inflows", "US spot ETF net inflow over the last 3 sessions, last one positive"],
    ["reclaim", "Price back above its week", "daily close above its 7-day average"],
  ];
  const SIG_COLOR = { 2: "var(--up)", 1: "var(--s4)", 0: "var(--down)" };
  const SIG_WORD = { 2: "green", 1: "amber", 0: "red" };

          <div class="card"><div class="card-h"><h3>${L.bars(n)}</h3><span class="last">${a}</span></div><div class="chart" style="height:260px"><canvas id="er-bars"></canvas></div><div class="note">${zh ? "按交易日记账；正为增持，负为减持" : "By trade date; positive = added"}</div></div>
          <div class="card"><div class="card-h"><h3>${L.focus}</h3><span class="last">${a}</span></div>
            ${fundsHave ? `<div class="er-focus"><div class="up"><h4>${L.upL}</h4>${ups.length ? ups.map((f, i) => `<div class="row"><i>${i + 1}</i><span>${nm(f)} <small>${f.ticker}</small></span><b>${sn(f.coins)}</b></div>`).join("") : "<p>–</p>"}</div>
              <div class="dn"><h4>${L.dnL}</h4>${dns.length ? dns.map((f, i) => `<div class="row"><i>${i + 1}</i><span>${nm(f)} <small>${f.ticker}</small></span><b>${sn(f.coins)}</b></div>`).join("") : "<p>–</p>"}</div></div>` : `<p class="note">${L.noFunds}</p>`}
          </div>
        </div>
        ${fundsHave ? `<div class="er-grid3">
          <div class="card"><div class="card-h"><h3>${L.perEtf(a)}</h3><span class="last">${r.fund_date}</span></div>
            <div class="er-bars">${byChange.map((f) => { const mx = Math.max(...funds.map((x) => Math.abs(x.coins || 0)), 1e-9); const w = Math.abs(f.coins || 0) / mx * 50;
              return `<div class="row"><span>${nm(f)} <small>${f.ticker}</small></span><div class="track"><i class="${f.coins >= 0 ? "pos" : "neg"}" style="${f.coins >= 0 ? "left:50%" : `left:${50 - w}%`};width:${w}%"></i></div><b class="${signCls(f.coins)}">${f.coins ? sn(f.coins) : num(0)}</b></div>`; }).join("")}</div>
            <div class="note">${L.perNote}</div></div>
          <div class="card"><div class="card-h"><h3>${L.rank}</h3><span class="last">${a}</span></div>
            <div class="tbl-wrap"><table class="er-rank"><thead><tr><th>${L.ranked}</th><th style="text-align:left">${L.fund}</th><th>${L.holdCol(a)}</th><th>${L.share}</th></tr></thead><tbody>
            ${top.map((f, i) => `<tr><td>${i + 1}</td><td style="text-align:left">${nm(f)} <small>${f.ticker}</small></td><td>${num(f.hold)}</td><td><div class="er-share"><i style="width:${Math.min(100, f.share || 0)}%"></i></div>${fmt(f.share, 2)}%</td></tr>`).join("")}
            ${rest.length ? `<tr><td>–</td><td style="text-align:left">${L.others} <small>${rest.length}</small></td><td>${num(restHold)}</td><td><div class="er-share"><i style="width:${Math.min(100, restShare)}%"></i></div>${fmt(restShare, 2)}%</td></tr>` : ""}
            </tbody></table></div></div>
          <div class="card"><div class="card-h"><h3>${L.flowStats}</h3><span class="last">${funds.length} ETF</span></div>
            <div class="er-counts"><div class="up"><span>${L.nIn}</span><b>${st.n_in}</b></div><div class="dn"><span>${L.nOut}</span><b>${st.n_out}</b></div><div><span>${L.nFlat}</span><b>${st.n_flat}</b></div></div>
            <div class="er-big"><div class="up"><span>${L.topIn}</span><b>${st.top_in ? nm(st.top_in) : "–"}</b><em>${st.top_in ? sn(st.top_in.coins) + " " + a : ""}</em></div>
              <div class="dn"><span>${L.topOut}</span><b>${st.top_out ? nm(st.top_out) : "–"}</b><em>${st.top_out ? sn(st.top_out.coins) + " " + a : ""}</em></div></div>
            <div class="er-sums"><div><span>${L.sumIn}</span><b class="up">${sn(st.sum_in)} ${a}</b></div><div><span>${L.sumOut}</span><b class="down">${sn(st.sum_out)} ${a}</b></div></div></div>
        </div>` : ""}
        <div class="note er-method">${L.method(r)}</div>
      </div>`;
    // charts
    const labels = S.date.map((d) => d.slice(5));
    const lblPlugin = (fmtF, every) => ({ id: "erLbl", afterDatasetsDraw(chart) {
      if (n > 10) return; const { ctx } = chart, meta = chart.getDatasetMeta(0);
      ctx.save(); ctx.font = "600 10.5px 'IBM Plex Mono', ui-monospace, Menlo, monospace"; ctx.fillStyle = css("--ink-2"); ctx.textAlign = "center";
      meta.data.forEach((p, i) => { const val = chart.data.datasets[0].data[i]; if (!isNum(val)) return; ctx.textBaseline = val >= 0 || chart.config.type === "line" ? "bottom" : "top";
        ctx.fillText(fmtF(val), p.x, p.y + (ctx.textBaseline === "bottom" ? -6 : 6)); });
      ctx.restore(); } });
    const oh = baseOpts(); oh.scales.y.ticks.callback = (x) => num(x, 0); oh.layout = { padding: { top: 24, left: 6, right: 40 } }; oh.scales.y.grace = "8%";
    oh.plugins.tooltip.callbacks = { label: (c) => ` ${num(c.parsed.y)} ${a}` };
    draw("er-hold", { type: "line", plugins: [lblPlugin((x) => num(x, 0))], options: oh, data: { labels, datasets: [{ data: S.hold, borderColor: css("--s1"), backgroundColor: css("--s1"), borderWidth: 2, pointRadius: n <= 30 ? 3 : 0, tension: 0 }] } });
    const ob = baseOpts(); ob.scales.y.ticks.callback = (x) => num(x, 0); ob.layout = { padding: { top: 18 } };
    ob.plugins.tooltip.callbacks = { label: (c) => ` ${sn(c.parsed.y)} ${a} · ${usdM(S.usd[c.dataIndex])}` };
    draw("er-bars", { type: "bar", plugins: [lblPlugin((x) => sn(x, 0))], options: ob, data: { labels, datasets: [{ data: S.coins, backgroundColor: S.coins.map((x) => x >= 0 ? css("--up") : css("--down")), borderRadius: 4, borderSkipped: "start", maxBarThickness: 40 }] } });
    $("#er-print").onclick = () => { const u = new URL(location.href); u.searchParams.set("print", "1"); u.hash = "etfreport"; window.open(u.toString(), "_blank"); };
  }

  // ================================================================ shell
  const renderers = { overview: renderOverview, etf: renderEtf, market: renderMarket, deriv: renderDeriv, since: renderSince, etfreport: renderEtfReport };
  for (const a of ["BTC", "ETH", "XRP", "SOL", "ZEC"]) renderers[a.toLowerCase()] = () => renderCoin(a);
  renderers.more = () => renderCoin(MORE_COINS.includes(state.moreCoin) ? state.moreCoin : MORE_COINS[0], "more");
  function show(view) {
    state.view = view; save();
    for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-selected", String(b.dataset.view === view));
    for (const k in renderers) $("#view-" + k).hidden = k !== view;
    if (D) renderers[view]();
  }
  document.addEventListener("click", (ev) => {
    const tab = ev.target.closest("nav.tabs button"); if (tab) { history.replaceState(null, "", "#" + tab.dataset.view); show(tab.dataset.view); return; }
    const b = ev.target.closest("button[data-seg]"); if (!b) return;
    const k = b.dataset.seg; const raw = b.dataset.v;
    state[k] = (k === "etfRange" || k === "mktRange" || k === "erWin") ? Number(raw) : raw; save(); renderers[state.view]();
  });
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const rerender = () => D && renderers[state.view]();
  mq.addEventListener ? mq.addEventListener("change", rerender) : mq.addListener(rerender);
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function footer() {
    $("#footer").innerHTML = `<span class="eyebrow">Data freshness · last successful run per source (UTC)</span>
      <div class="fresh">${D.freshness.map((f) => `<span class="pill" title="${f.status}">${f.source} ${f.last_run.slice(5)}${f.status === "ok" ? "" : " · " + f.status}</span>`).join("")}</div>
      <div class="note">Snapshot of the local market-data-hub database. Sources: Binance, SoSoValue, Farside, TradingView, DefiLlama, FRED, Cboe, Nasdaq, Coin Metrics, alternative.me, Deribit, CoinGecko, Coinbase, OKX, Bybit, Hyperliquid, CFTC. Candlestick chart by <a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener">TradingView Lightweight Charts</a>. Not investment advice.</div>`;
  }
  if (PRINT) { document.body.classList.add("print"); document.documentElement.setAttribute("data-theme", "light");
    const q = new URLSearchParams(location.search); if (q.get("asset")) state.erAsset = q.get("asset"); if (q.get("lang")) state.erLang = q.get("lang"); state.erWin = 7; }
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  fontsReady.then(() => fetch("data.json", { cache: "no-store" })).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then((d) => {
    D = d;
    const lastEtf = D.etf.BTC.date[D.etf.BTC.date.length - 1];
    $("#asof").textContent = `Snapshot ${D.generated_at} · ETF flows through ${lastEtf}`;
    footer();
    const h = location.hash.replace("#", "");
    show(renderers[h] ? h : (renderers[state.view] ? state.view : "overview"));
  }).catch((e) => {
    $("#asof").textContent = "Snapshot unavailable";
    $("#view-overview").innerHTML = `<div class="err"><h2>The data file didn't load</h2><p class="sub">The page couldn't read data.json (${e.message}). Ask Claude to refresh the dashboard, which republishes the data file.</p></div>`;
  });
})();
</script>
